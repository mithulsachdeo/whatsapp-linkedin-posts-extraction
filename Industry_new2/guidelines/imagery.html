<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Halftone imagery</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.sw{display:grid;grid-template-columns:repeat(9,1fr);gap:0}.sw div{height:64px;display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-mono)}.n{font:600 10px/1.3 var(--font-mono);color:var(--color-muted)}.lbl{font:600 10.5px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--color-muted)}</style></head><body class="paper"><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px"><figure class="figure"><div style="aspect-ratio:4/3;overflow:hidden"><img src="../assets/photo.jpg" alt="" style="width:100%;height:100%;object-fit:cover"></div><figcaption class="caption">Original</figcaption></figure><figure class="figure"><div class="halftone" style="aspect-ratio:4/3"><img src="../assets/photo.jpg" alt=""></div><figcaption class="caption">Through .halftone / HalftonePhoto</figcaption></figure></div></body></html>
