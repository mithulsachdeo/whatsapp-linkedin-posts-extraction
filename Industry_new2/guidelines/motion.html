<!-- @dsCard group="Brand" viewport="700x260" name="Motion" subtitle="Ink-in, press reveal, stamp, wire, type-on (click to replay)" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.sw{display:grid;grid-template-columns:repeat(9,1fr);gap:0}.sw div{height:64px;display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-mono)}.n{font:600 10px/1.3 var(--font-mono);color:var(--color-muted)}.lbl{font:600 10.5px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--color-muted)}</style></head><body class="paper"><div id="m" style="display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;cursor:pointer"><div><div class="lbl">ink-in · 1.1s</div><div class="anim-ink" style="font:44px/1.1 var(--font-masthead)">The Postboard</div></div><div><div class="lbl">stamp-in · 550ms thump</div><div class="stamp anim-stamp" style="width:76px;height:76px;margin-top:6px;--delay:.3s"><span class="stamp-count" style="font-size:24px">4×</span></div></div><div><div class="lbl">press-reveal · 900ms</div><div class="anim-press" style="font:22px/1.15 var(--font-display)">Columns print top to bottom as the page loads</div></div><div><div class="lbl">type-on + caret</div><div style="font:16px var(--font-body)"><span class="anim-type">Finding LinkedIn links</span><span class="caret">▌</span></div></div></div><p class="n" style="margin-top:12px">All honour prefers-reduced-motion. Wire ticker: 60s linear loop, pauses on hover.</p><script>document.getElementById('m').onclick=e=>{const m=e.currentTarget;const c=m.cloneNode(true);m.replaceWith(c);c.onclick=m.onclick;}</script></body></html>
