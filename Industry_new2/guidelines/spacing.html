<!-- @dsCard group="Spacing" viewport="700x120" name="Spacing scale" subtitle="--space-* in px" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.sw{display:grid;grid-template-columns:repeat(9,1fr);gap:0}.sw div{height:64px;display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-mono)}.n{font:600 10px/1.3 var(--font-mono);color:var(--color-muted)}.lbl{font:600 10.5px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--color-muted)}</style></head><body class="paper"><div style="display:flex;align-items:flex-end;gap:14px"><div style="text-align:center"><div style="width:var(--space-1);height:var(--space-1);background:var(--color-text)"></div><div class="n" style="margin-top:4px">1</div></div><div style="text-align:center"><div style="width:var(--space-2);height:var(--space-2);background:var(--color-text)"></div><div class="n" style="margin-top:4px">2</div></div><div style="text-align:center"><div style="width:var(--space-3);height:var(--space-3);background:var(--color-text)"></div><div class="n" style="margin-top:4px">3</div></div><div style="text-align:center"><div style="width:var(--space-4);height:var(--space-4);background:var(--color-text)"></div><div class="n" style="margin-top:4px">4</div></div><div style="text-align:center"><div style="width:var(--space-5);height:var(--space-5);background:var(--color-text)"></div><div class="n" style="margin-top:4px">5</div></div><div style="text-align:center"><div style="width:var(--space-6);height:var(--space-6);background:var(--color-text)"></div><div class="n" style="margin-top:4px">6</div></div><div style="text-align:center"><div style="width:var(--space-8);height:var(--space-8);background:var(--color-text)"></div><div class="n" style="margin-top:4px">8</div></div><div style="text-align:center"><div style="width:var(--space-10);height:var(--space-10);background:var(--color-text)"></div><div class="n" style="margin-top:4px">10</div></div><div style="text-align:center"><div style="width:var(--space-12);height:var(--space-12);background:var(--color-text)"></div><div class="n" style="margin-top:4px">12</div></div><div style="text-align:center"><div style="width:var(--space-16);height:var(--space-16);background:var(--color-text)"></div><div class="n" style="margin-top:4px">16</div></div></div></body></html>
