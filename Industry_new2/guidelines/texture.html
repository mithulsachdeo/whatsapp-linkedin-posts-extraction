<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Paper texture</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.sw{display:grid;grid-template-columns:repeat(9,1fr);gap:0}.sw div{height:64px;display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-mono)}.n{font:600 10px/1.3 var(--font-mono);color:var(--color-muted)}.lbl{font:600 10.5px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--color-muted)}</style></head><body class="paper"><div style="display:flex;gap:16px"><div class="paper" style="flex:1;height:84px;border:1px solid var(--color-rule)"></div><div style="flex:1;height:84px;border:1px solid var(--color-rule);background:var(--color-bg)"></div></div><p class="n" style="margin-top:8px">left: .paper (page backgrounds) · right: flat --color-bg (inside boxes)</p></body></html>
