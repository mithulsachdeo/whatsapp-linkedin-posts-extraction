<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Night edition</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.sw{display:grid;grid-template-columns:repeat(9,1fr);gap:0}.sw div{height:64px;display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-mono)}.n{font:600 10px/1.3 var(--font-mono);color:var(--color-muted)}.lbl{font:600 10.5px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--color-muted)}</style></head><body class="paper"><div data-edition="night" class="paper" style="padding:16px;border:1px solid var(--color-text)"><div class="kicker">Night edition</div><div class="headline headline-lg" style="margin:4px 0">Ramps flip; components need no changes</div><p class="standfirst" style="font-size:15px">Set data-edition="night" on any ancestor. 100 becomes the darkest step and 900 the lightest.</p></div></body></html>
