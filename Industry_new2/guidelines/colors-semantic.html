<!-- @dsCard group="Colors" viewport="700x150" name="Semantic roles" subtitle="Use these names first" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Semantic roles</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.sw{display:grid;grid-template-columns:repeat(9,1fr);gap:0}.sw div{height:64px;display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-mono)}.n{font:600 10px/1.3 var(--font-mono);color:var(--color-muted)}.lbl{font:600 10.5px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--color-muted)}</style></head><body class="paper"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div style="display:flex;gap:8px;align-items:center"><span style="width:34px;height:34px;flex:none;background:var(--color-bg);border:1px solid var(--color-text)"></span><span><b style="font:700 12px var(--font-ui)">Paper</b><br><span class="n">--color-bg</span></span></div><div style="display:flex;gap:8px;align-items:center"><span style="width:34px;height:34px;flex:none;background:var(--color-surface);border:1px solid var(--color-text)"></span><span><b style="font:700 12px var(--font-ui)">Raised paper</b><br><span class="n">--color-surface</span></span></div><div style="display:flex;gap:8px;align-items:center"><span style="width:34px;height:34px;flex:none;background:var(--color-text);border:1px solid var(--color-text)"></span><span><b style="font:700 12px var(--font-ui)">Ink</b><br><span class="n">--color-text</span></span></div><div style="display:flex;gap:8px;align-items:center"><span style="width:34px;height:34px;flex:none;background:var(--color-muted);border:1px solid var(--color-text)"></span><span><b style="font:700 12px var(--font-ui)">Muted ink</b><br><span class="n">--color-muted</span></span></div><div style="display:flex;gap:8px;align-items:center"><span style="width:34px;height:34px;flex:none;background:var(--color-rule);border:1px solid var(--color-text)"></span><span><b style="font:700 12px var(--font-ui)">Hairline</b><br><span class="n">--color-rule</span></span></div><div style="display:flex;gap:8px;align-items:center"><span style="width:34px;height:34px;flex:none;background:var(--color-accent);border:1px solid var(--color-text)"></span><span><b style="font:700 12px var(--font-ui)">Press red</b><br><span class="n">--color-accent</span></span></div><div style="display:flex;gap:8px;align-items:center"><span style="width:34px;height:34px;flex:none;background:var(--color-accent-text);border:1px solid var(--color-text)"></span><span><b style="font:700 12px var(--font-ui)">Red text</b><br><span class="n">--color-accent-text</span></span></div><div style="display:flex;gap:8px;align-items:center"><span style="width:34px;height:34px;flex:none;background:var(--color-accent-2-text);border:1px solid var(--color-text)"></span><span><b style="font:700 12px var(--font-ui)">Sepia text</b><br><span class="n">--color-accent-2-text</span></span></div></div></body></html>
