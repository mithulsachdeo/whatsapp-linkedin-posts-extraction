<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Rules</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.sw{display:grid;grid-template-columns:repeat(9,1fr);gap:0}.sw div{height:64px;display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-mono)}.n{font:600 10px/1.3 var(--font-mono);color:var(--color-muted)}.lbl{font:600 10.5px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--color-muted)}</style></head><body class="paper"><div class="lbl">Hairline · --color-rule</div><hr class="rule"><div class="lbl">Strong · edition strip</div><hr class="rule-strong"><div class="lbl">Double · section breaks, under the lead</div><hr class="rule-double"><div class="lbl">Dotted · list rows</div><hr class="rule-dotted"><div class="lbl">Heavy · column heads</div><hr class="rule-heavy"></body></html>
