<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sepia</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.sw{display:grid;grid-template-columns:repeat(9,1fr);gap:0}.sw div{height:64px;display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-mono)}.n{font:600 10px/1.3 var(--font-mono);color:var(--color-muted)}.lbl{font:600 10.5px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--color-muted)}</style></head><body class="paper"><div class="sw"><div style="background:var(--color-accent-2-100);color:var(--color-neutral-900)">100</div><div style="background:var(--color-accent-2-200);color:var(--color-neutral-900)">200</div><div style="background:var(--color-accent-2-300);color:var(--color-neutral-900)">300</div><div style="background:var(--color-accent-2-400);color:var(--color-neutral-900)">400</div><div style="background:var(--color-accent-2-500);color:var(--color-neutral-100)">500</div><div style="background:var(--color-accent-2-600);color:var(--color-neutral-100)">600</div><div style="background:var(--color-accent-2-700);color:var(--color-neutral-100)">700</div><div style="background:var(--color-accent-2-800);color:var(--color-neutral-100)">800</div><div style="background:var(--color-accent-2-900);color:var(--color-neutral-100)">900</div></div><p class="n" style="margin-top:8px">--color-accent-2-* · 700 for text · 200 for badges · pending attribution always sepia</p></body></html>
