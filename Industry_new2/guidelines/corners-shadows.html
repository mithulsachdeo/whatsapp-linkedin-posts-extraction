<!-- @dsCard group="Spacing" viewport="700x150" name="Corners & elevation" subtitle="Square corners; hard offset shadows only for overlays" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Corners & elevation</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;margin:0}.sw{display:grid;grid-template-columns:repeat(9,1fr);gap:0}.sw div{height:64px;display:flex;align-items:flex-end;padding:6px;font:600 10px/1 var(--font-mono)}.n{font:600 10px/1.3 var(--font-mono);color:var(--color-muted)}.lbl{font:600 10.5px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--color-muted)}</style></head><body class="paper"><div style="display:flex;gap:28px;align-items:center"><div style="width:120px;height:80px;border:1.5px solid var(--color-text);background:var(--color-surface)"></div><div style="width:120px;height:80px;border:1.5px solid var(--color-text);background:var(--color-surface);box-shadow:var(--shadow-md)"></div><div style="width:120px;height:80px;border:1.5px solid var(--color-text);background:var(--color-surface);box-shadow:var(--shadow-lg)"></div><div class="stamp" style="width:80px;height:80px"><span class="stamp-label">Round</span></div></div><p class="n" style="margin-top:10px">radius 0 · --shadow-md 3px · --shadow-lg 6px (dialogs) · circles only for stamps</p></body></html>
