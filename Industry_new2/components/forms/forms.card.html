<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forms & buttons</title>
<link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script>
<style>body{padding:24px}.lbl{font:600 10.5px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--color-muted);margin:0 0 8px}.stack{display:flex;flex-direction:column;gap:24px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style>
</head><body class="paper"><div id="root"></div>
<script type="text/babel">
const NS = window.Industry_indust;
const { Button, TextField, Select, OptionRule } = NS;
function Demo(){const [s,setS]=React.useState('recent');const [l,setL]=React.useState('front');return(<div className="stack">
<div className="row"><Button variant="ink">Send to press</Button><Button>Copy link</Button><Button variant="red">Remove import</Button><Button variant="link">File another export</Button><Button variant="ink" disabled>Disabled</Button><Button size="sm">Small</Button></div>
<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:24}}>
<TextField type="search" placeholder="Search the archive…" aria-label="Search" />
<TextField label="Group name" defaultValue="PM Collective" hint="As it appears in WhatsApp." />
<TextField label="Export file" boxed error="This isn't a WhatsApp export." defaultValue="notes.pdf" />
<Select label="Assign byline" options={[{value:'',label:'Choose a member…'},'Ananya Rao','Karan Mehta','Priya Sharma']} />
</div>
<div className="row" style={{gap:32}}><OptionRule label="Order" value={s} onChange={setS} options={[{value:'recent',label:'Latest'},{value:'most',label:'Most shared'}]} /><OptionRule label="Layout" value={l} onChange={setL} options={[{value:'front',label:'Front page'},{value:'index',label:'Index'}]} /><label className="check"><input type="checkbox" defaultChecked /> Include both groups</label></div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
