# Render deploy config for Postboard ("The Rethinkers' Times").
#
# Why Render (not Vercel): this is a single long-running Node process with an
# on-disk SQLite (WAL) database, a folder-watch poller, and a nightly backup
# scheduler. That needs a persistent process + a writable, durable filesystem
# — which serverless platforms (Vercel) do not provide. A Render Web Service
# with a mounted Disk gives exactly that, with no code changes (the app already
# reads PORT, DB_PATH and BACKUP_DIR from the environment).
#
# One instance only: SQLite has a single writer and the Disk cannot be shared
# across instances, so this service must not be horizontally scaled. Mounting a
# Disk already pins it to one instance — leave it that way.
#
# Node is pinned to 24 so `node:sqlite` runs without the --experimental-sqlite
# flag (Node 22.x/23.x would require it and `npm start` would fail).

services:
  - type: web
    name: postboard
    runtime: node
    plan: starter            # a paid plan is required to attach a Disk
    region: singapore        # closest Render region to India; change if preferred
    branch: design/industry-new2
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DB_PATH
        value: /data/postboard.sqlite
      - key: BACKUP_DIR
        value: /data/backups
      - key: ADMIN_TOKEN
        sync: false          # set this as a secret in the Render dashboard — never commit it
    disk:
      name: postboard-data
      mountPath: /data
      sizeGB: 1
