# Render deploy config for Postboard ("The Rethinkers' Times").
#
# Why this works on the FREE tier now: the database moved from on-disk SQLite
# to Turso (hosted libSQL) — see src/db/config.js / docs/superpowers/plans/
# 2026-10-12-turso-serverless-migration.md. The app no longer needs a mounted
# Disk or a durable local filesystem, so it can run as a plain free Render Web
# Service. The free plan's filesystem is ephemeral and the service sleeps
# after ~15 min idle (cold start on next request) — both are fine because all
# durable state lives in Turso, not on the instance.
#
# One instance is still fine either way: libSQL/Turso is a managed remote
# database, so there's no local single-writer file to worry about if Render
# ever spins up more than one instance (it won't, on the free plan).
#
# Node is pinned to 24 to match the rest of the stack (see .node-version).

services:
  - type: web
    name: postboard
    runtime: node
    plan: free
    branch: design/industry-new2
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false          # libsql://<db>-<org>.turso.io — set in the Render dashboard
      - key: DATABASE_AUTH_TOKEN
        sync: false          # Turso db auth token (secret) — set in the Render dashboard
      - key: ADMIN_TOKEN
        sync: false          # admin password — set in the Render dashboard (secret)
